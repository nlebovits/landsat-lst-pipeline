name: Bug report
description: Report code, a command, or a page on the docs site that does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        For a wrong or missing value in the published data, use the data issue
        form instead. Report a security problem privately, as SECURITY.md
        describes.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran or opened, and what you saw. Paste the full error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands or the page URL, in order.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag or the commit SHA you ran.
      placeholder: v0.1.0
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and uv version.
      placeholder: Ubuntu 24.04, Python 3.12.7, uv 0.9.0
