# The docs site. Render it from the repository root:
#
#     uv sync --group docs
#     uv run --group docs quarto render docs
#     uv run --group docs quarto preview docs
#
# `.github/workflows/docs.yml` renders it on every pull request and publishes
# `_site/` to GitHub Pages from `main`.
project:
  type: website
  output-dir: _site
  # An explicit list, because `docs/` also holds PROSE.md and conformance.md.
  # Both are repository documents rather than site pages, and a default render
  # would publish them. Globs rather than names where a directory fills up
  # over time: a glob that matches nothing renders nothing.
  render:
    - index.qmd
    - quickstart.qmd
    - about/*.qmd
    - tutorials/*.qmd
    - examples/index.qmd
    - examples/*/index.qmd
    - contribute/*.qmd
  resources:
    - images/favicon.svg
    - images/thumbnail.png

# Notebook pages run their cells once and reuse the stored outputs until the
# source changes. Commit `docs/_freeze/` with the page that produced it: the
# docs workflow renders without executing and fails when the freeze is stale.
execute:
  freeze: auto
  echo: true
  warning: false

website:
  title: Landsat LST P95
  description: >-
    Global 30 m 95th-percentile land surface temperature composites from
    Landsat 8 and 9, 2021 to 2025, as cloud-optimized GeoTIFFs on Source
    Cooperative.
  site-url: https://nlebovits.github.io/landsat-lst-pipeline/
  repo-url: https://github.com/nlebovits/landsat-lst-pipeline
  repo-subdir: docs
  repo-branch: main
  repo-actions: [edit, source, issue]
  favicon: images/favicon.svg
  image: images/thumbnail.png
  open-graph:
    image: images/thumbnail.png
    image-alt: >-
      World map of 95th-percentile land surface temperature, in the magma
      color ramp.
  twitter-card:
    card-style: summary_large_image
    image: images/thumbnail.png
  search:
    location: sidebar
    type: textbox
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: false

  # No navbar. The sidebar holds the site title, search, every page, and the
  # links that leave the site.
  sidebar:
    title: Landsat LST P95
    style: docked
    search: true
    collapse-level: 2
    contents:
      - text: Home
        href: index.qmd
      - quickstart.qmd
      - text: Tutorial
        href: tutorials/pergamino.qmd
      - text: Examples
        href: examples/index.qmd
      - section: About
        contents:
          - about/philosophy.qmd
          - about/methods.qmd
          - about/known-issues.qmd
          - about/intended-use.qmd
          - about/provenance.qmd
      - section: Contribute
        contents:
          - text: Contributing
            href: contribute/index.qmd
          - contribute/notebooks.qmd
          - contribute/code-of-conduct.qmd
          - contribute/changelog.qmd
      # Links that leave the site. _external-links.html marks each with an
      # arrow and a tooltip that names the destination.
      - text: "---"
      - text: Web map
        href: https://sensable-heat.vercel.app/
      - text: Dataset
        href: https://source.coop/nlebovits/landsat-lst
      - text: Source code
        href: https://github.com/nlebovits/landsat-lst-pipeline

  page-footer:
    right: >-
      Docs [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) ·
      Code [Apache-2.0](https://github.com/nlebovits/landsat-lst-pipeline/blob/main/LICENSE) ·
      Data [CC0-1.0](https://creativecommons.org/publicdomain/zero/1.0/)

# One color scheme, light. Naming the brand file as the light brand stops
# Quarto from building a second, dark stylesheet from it. With no dark
# stylesheet, Quarto renders no color-scheme toggle.
brand:
  light: _brand.yml

format:
  html:
    theme: [brand, styles.scss]
    highlight-style: lst-code.theme
    # Beside a docked sidebar, Quarto sets the text column to body-width plus
    # 200px, less 3em: 640px here, about 78 characters of 17px IBM Plex Sans.
    # Quarto's default of 800px gives a 950px column and lines near 110.
    grid:
      body-width: 491px
    include-after-body: _external-links.html
    # A click on a figure opens it at full size.
    lightbox: auto
    toc: true
    toc-depth: 3
    toc-title: On this page
    code-fold: true
    code-summary: Show the code
    code-tools: true
    code-copy: true
    code-overflow: wrap
    link-external-icon: false
    link-external-newwindow: false
    anchor-sections: true
    smooth-scroll: false
    fig-responsive: true
    lang: en
